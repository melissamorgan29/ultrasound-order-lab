<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sono Order Lab</title><style>:root{font-family:Arial,sans-serif;color:#183047;background:#f3f7fa}body{margin:0}header{background:#102e46;color:white;padding:24px max(24px,calc((100% - 1000px)/2))}header p{color:#b8d8e5}main{max-width:1000px;margin:28px auto;padding:0 20px}.panel{background:white;border:1px solid #d8e3e9;border-radius:14px;padding:24px;margin-bottom:18px;box-shadow:0 3px 12px #16334b0b}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button{cursor:pointer;border:1px solid #b3cbd6;background:white;border-radius:9px;padding:11px 14px;font-weight:bold;color:#12394b}button:hover,button:focus-visible{outline:2px solid #1b8294}button.active,.primary{background:#086e80;color:white;border-color:#086e80}.muted{color:#526a79}.preceptor{display:flex;gap:15px;background:#e9f5f7;border-left:5px solid #087e8b;padding:18px;border-radius:12px;margin:15px 0}.avatar{display:grid;place-items:center;flex:none;background:#086e80;color:white;border-radius:50%;height:52px;width:52px;font-weight:bold}.preceptor p{margin:7px 0 0}.stepnote{font-size:13px;color:#526a79}.tag{background:#e2f4f2;color:#086e80;border-radius:30px;padding:5px 10px;font-size:12px}.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.doc{border:2px solid #bed1da;border-radius:10px;padding:15px;background:#fbfdff}.doc h3{margin-top:0}.field{padding:8px 0;border-bottom:1px solid #e1eaf0}.options{display:grid;gap:9px}.option{text-align:left;font-weight:normal}.feedback{padding:14px;border-radius:9px;margin-top:14px;background:#e8f3f8}.good{background:#e3f5eb}.warn{background:#fff1e3}progress{width:100%;height:14px}footer{padding:20px;text-align:center;color:#5d7280}@media(max-width:650px){.docgrid{grid-template-columns:1fr}} </style></head><body><header><span class="tag">VIRTUAL CLINICAL TRAINING</span><h1>SONO ORDER LAB</h1><p>Verify • Compare • Clarify • Document</p></header><main><div class="tabs" id="tabs"></div><section class="panel" id="view" aria-live="polite"></section><div class="panel"><strong>Learning progress</strong><progress id="progress" value="0" max="5"></progress><p class="muted" id="progressText"></p></div></main><footer>Educational simulations only. Follow your facility's current policies and applicable requirements. All patient data are fictional.</footer><script>
const steps=['Start','Order Essentials','Order Detective','Compare Documents','Fix the Order','Competency'];let current=0,done=new Set(),score=0,answered={},identified=new Set(),mentorStage=0,mentorMistakes=0;const $=id=>document.getElementById(id);const orderFields=['Patient name','Second patient identifier (e.g., DOB)','Requested exam and body region','Clinical indication / reason for exam','Ordering provider identification and authorization','Laterality when applicable'];const cases=[{name:'Avery Lane',dob:'04/18/1998',exam:'US renal complete',reason:'Flank pain',provider:'Dr. Reed',reqExam:'US renal complete',reqDob:'04/18/1998',reqReason:'Flank pain',error:'none',why:'All displayed details match. Continue with the remaining institutional checks before scanning.'},{name:'Jordan Ellis',dob:'07/09/1984',exam:'US venous duplex LEFT lower extremity',reason:'Left calf swelling',provider:'Dr. Chen',reqExam:'US venous duplex RIGHT lower extremity',reqDob:'07/09/1984',reqReason:'Left calf swelling',error:'laterality',why:'The order specifies LEFT while the requisition specifies RIGHT. Stop and request correction through the approved workflow.'},{name:'Morgan Blake',dob:'02/11/1977',exam:'US thyroid',reason:'Palpable neck lump',provider:'Dr. Patel',reqExam:'US thyroid',reqDob:'02/11/1978',reqReason:'Palpable neck lump',error:'identity',why:'The dates of birth do not match. Verify patient identity and contact registration/order-entry staff according to policy.'},{name:'Taylor Brooks',dob:'12/03/1992',exam:'US pelvis transabdominal',reason:'Pelvic pain',provider:'Dr. Silva',reqExam:'US pelvis transabdominal',reqDob:'12/03/1992',reqReason:'Routine screening',error:'indication',why:'The clinical indication differs. Clarify the discrepancy before proceeding and ensure authorized records agree.'},{name:'Casey Rivera',dob:'08/27/2001',exam:'US scrotum/testes',reason:'Testicular pain',provider:'Dr. Nguyen',reqExam:'US abdomen complete',reqDob:'08/27/2001',reqReason:'Testicular pain',error:'exam',why:'The requisition is for a different examination. Do not silently substitute the ordered study; follow the correction pathway.'}];function complete(n){done.add(n);renderProgress()}function renderProgress(){$('progress').value=done.size;$('progressText').textContent=done.size+' of 5 learning activities completed.'}function navigate(n){current=n;render()}function render(){ $('tabs').innerHTML=steps.map((s,i)=>`<button class="${current===i?'active':''}" onclick="navigate(${i})">${s}</button>`).join('');const v=$('view');if(current===0)v.innerHTML=`<h2>Welcome to your virtual ultrasound department</h2><p>Practice reviewing provider orders, comparing requisitions, and selecting safe correction steps before an examination. This experience uses fictional cases and immediate decision-based feedback.</p><h3>By the end, you can:</h3><ul><li>Recognize essential order information.</li><li>Identify mismatches between an order and a facility requisition.</li><li>Choose an appropriate clarification and documentation pathway.</li></ul><button class="primary" onclick="navigate(1)">Begin training →</button>`;if(current===1)v.innerHTML=`<h2>1. Order essentials</h2><p>A valid order must provide enough accurate information to identify the patient, identify the requested examination, support its clinical purpose, and establish an authorized request. Exact requirements vary by institution and jurisdiction.</p><h3>Review these key elements</h3>${orderFields.map((x,i)=>`<p class="field"><strong>${i+1}.</strong> ${x}</p>`).join('')}<p class="muted">Urgency, special instructions, and diagnosis codes may also be required by the workflow or payer. A diagnosis code does not replace a meaningful clinical indication when one is needed.</p><button class="primary" onclick="complete(1);navigate(2)">I reviewed the essentials →</button>`;if(current===2)v.innerHTML=`<h2>2. Order Detective</h2><p>Select the missing essential elements in this simulated provider order.</p><div class="doc"><h3>PROVIDER ORDER</h3><div class="field">Patient: Sam Carter</div><div class="field">DOB: 06/14/1990</div><div class="field">Requested exam: Ultrasound</div><div class="field">Clinical indication: —</div><div class="field">Ordering provider: Dr. Miller (authorized)</div></div><p><strong>Which items require clarification?</strong> Select all that apply.</p><div class="options">${['Exam type / body region is unclear','Clinical indication is missing','Patient name is missing','Ordering provider is missing'].map((s,i)=>`<label><input type="checkbox" class="detect" value="${i}"> ${s}</label>`).join('')}</div><p><button class="primary" onclick="checkDetect()">Check my findings</button></p><div id="result" role="status"></div>`;if(current===3)v.innerHTML=`<h2>3. Compare the documents</h2><p>Read the provider order and the facility requisition. Identify the discrepancy.</p>${documents(cases[1])}<h3>What is the discrepancy?</h3><div class="options">${['Patient date of birth','Laterality','Clinical indication','No discrepancy'].map((x,i)=>`<button class="option" onclick="choose('compare',${i},1,'Correct. The provider ordered LEFT, but the requisition shows RIGHT. The examination should not proceed with unresolved laterality.','Review both exam descriptions carefully.')">${x}</button>`).join('')}</div><div id="result" role="status"></div>`;if(current===4)renderMentor();if(current===5)renderQuiz();renderProgress()}
const mentorScenes=[
{speech:'The physician order says LEFT leg, but the facility requisition says RIGHT. What is your safest next action?',options:['Proceed using the requisition because it populates the worklist.','Pause and notify the supervising sonographer about the discrepancy.','Change the exam laterality in the system yourself.'],correct:1,good:'Exactly. An unresolved laterality mismatch must be addressed before scanning.',bad:'Do not proceed or change an order independently. Escalate the mismatch through the approved process.'},
{speech:'Your supervising sonographer asks you to explain the problem to the appropriate staff member. What information should you communicate?',options:['The two patient identifiers, ordered exam, conflicting laterality, and request for authorized clarification.','Only say that the worklist looks wrong.','Ask registration to change everything to the side the patient mentions.'],correct:0,good:'Clear, specific communication helps the authorized team verify and correct the record.',bad:'Provide identifying details and the exact mismatch; patient statements alone do not authorize an order change.'},
{speech:'Registration says they updated the worklist. What should you do before the examination?',options:['Start immediately because someone said it is fixed.','Ignore the original provider order now.','Verify that the corrected requisition matches the authorized provider order and document resolution per policy.'],correct:2,good:'Correct. Verify the authorized correction and the matching documents before proceeding.',bad:'A verbal assurance is not a substitute for verifying the correct order and requisition.'},
{speech:'The correction is still pending, and the department is busy. What should you do?',options:['Proceed to avoid delays.','Keep the examination on hold and communicate the delay through the approved chain of command.','Ask the patient to authorize the change.'],correct:1,good:'Patient safety and proper authorization take priority over schedule pressure.',bad:'An unresolved discrepancy must not be bypassed because the department is busy.'}
];
function renderMentor(){const v=$('view');if(mentorStage>=mentorScenes.length){v.innerHTML=`<h2>Clinical preceptor debrief</h2><div class="preceptor"><div class="avatar" aria-hidden="true">A</div><div><strong>Alex, RDMS · Virtual Preceptor</strong><p>You completed the correction workflow. Remember: pause, escalate, communicate precisely, verify authorized changes, and document resolution.</p></div></div><p>Decisions to revisit: <strong>${mentorMistakes}</strong>. You can replay the scenario to practice again.</p><button onclick="mentorStage=0;mentorMistakes=0;renderMentor()">Replay scenario</button> <button class="primary" onclick="complete(4);navigate(5)">Begin competency →</button>`;return}const scene=mentorScenes[mentorStage];v.innerHTML=`<h2>4. Fix the Order · Preceptor Simulation</h2><p class="stepnote">Decision ${mentorStage+1} of ${mentorScenes.length}</p><div class="preceptor"><div class="avatar" aria-hidden="true">A</div><div><strong>Alex, RDMS · Virtual Preceptor</strong><p>${scene.speech}</p></div></div>${mentorStage===0?documents(cases[1]):''}<div class="options">${scene.options.map((option,i)=>`<button class="option" onclick="mentorAnswer(${i})">${option}</button>`).join('')}</div><div id="mentorFeedback" role="status" aria-live="polite"></div>`}
function mentorAnswer(pick){const scene=mentorScenes[mentorStage],ok=pick===scene.correct;if(!ok)mentorMistakes++;document.querySelectorAll('#view .option').forEach(b=>b.disabled=true);$('mentorFeedback').innerHTML=`<div class="feedback ${ok?'good':'warn'}"><strong>Alex:</strong> ${ok?scene.good:scene.bad}</div><button class="primary" onclick="mentorStage++;renderMentor()">${mentorStage===mentorScenes.length-1?'View debrief':'Next decision →'}</button>`}
function documents(c){return `<div class="docgrid"><div class="doc"><h3>Provider order</h3>${[['Patient',c.name],['DOB',c.dob],['Exam',c.exam],['Indication',c.reason],['Provider',c.provider]].map(a=>`<div class="field"><strong>${a[0]}:</strong> ${a[1]}</div>`).join('')}</div><div class="doc"><h3>Facility requisition</h3>${[['Patient',c.name],['DOB',c.reqDob],['Exam',c.reqExam],['Indication',c.reqReason],['Ordering provider',c.provider]].map(a=>`<div class="field"><strong>${a[0]}:</strong> ${a[1]}</div>`).join('')}</div></div>`}
function checkDetect(){const vals=[...document.querySelectorAll('.detect:checked')].map(x=>+x.value).sort().join(',');const ok=vals==='0,1';$('result').innerHTML=`<div class="feedback ${ok?'good':'warn'}">${ok?'Correct! Both the requested examination and the clinical indication require clarification.':'Not quite. The patient and provider are identified, but “Ultrasound” is not a sufficiently specific exam, and no indication is given.'}</div>${ok?'<button onclick="complete(2);navigate(3)">Continue →</button>':''}`}
function choose(key,pick,correct,yes,no){const ok=pick===correct;$('result').innerHTML=`<div class="feedback ${ok?'good':'warn'}">${ok?yes:no}</div>${ok?`<button class="primary" onclick="complete(${key==='compare'?3:4});navigate(${key==='compare'?4:5})">Continue →</button>`:''}`}
function renderQuiz(){let index=Number(sessionStorage.getItem('quizIndex')||0);if(index>=cases.length){$('view').innerHTML=`<h2>Competency complete</h2><p>Your score: <strong>${score} / ${cases.length}</strong></p><p>${score===5?'Excellent work!':'Review the explanations and try again to strengthen your clinical reasoning.'}</p><button onclick="sessionStorage.removeItem('quizIndex');score=0;render()">Retry competency</button><button class="primary" onclick="window.print()">Print completion summary</button>`;complete(5);return}let c=cases[index];$('view').innerHTML=`<h2>5. Clinical competency</h2><p>Case ${index+1} of ${cases.length} — Compare the documents and select the most important discrepancy.</p>${documents(c)}<h3>What needs attention?</h3><div class="options">${[['none','No discrepancy in the displayed fields'],['laterality','Laterality mismatch'],['identity','Patient identifier mismatch'],['indication','Clinical indication mismatch'],['exam','Examination mismatch']].map(([key,label])=>`<button class="option" onclick="answerQuiz('${key}')">${label}</button>`).join('')}</div><div id="result" role="status"></div>`}
function answerQuiz(key){let i=Number(sessionStorage.getItem('quizIndex')||0),c=cases[i],ok=key===c.error;if(ok)score++;document.querySelectorAll('.option').forEach(b=>b.disabled=true);$('result').innerHTML=`<div class="feedback ${ok?'good':'warn'}"><strong>${ok?'Correct!':'Needs review.'}</strong> ${c.why}</div><p><button class="primary" onclick="sessionStorage.setItem('quizIndex',${i+1});renderQuiz()">${i===4?'See results':'Next case →'}</button></p>`}render();</script></body></html>
